# ToasterOS App Manager Configuration - Touch Optimized
# Add your applications here

[apps]
# Format: name = executable_path
Terminal = gnome-terminal
File Manager = nautilus  
Web Browser = firefox
Text Editor = gedit
Calculator = gnome-calculator
Settings = gnome-control-center
Music Player = rhythmbox

# Windows equivalents (uncomment and modify as needed)
# Terminal = cmd.exe
# File Manager = explorer.exe
# Web Browser = "C:\Program Files\Mozilla Firefox\firefox.exe"
# Text Editor = notepad.exe
# Calculator = calc.exe

[appearance]
# Hexagon size (larger for touch - distance between positions)
hex_size = 100

# Window dimensions (optimized for touch devices)
width = 1200
height = 800

# Colors (R, G, B, A)
background_color = 20, 25, 40, 255
app_color = 60, 70, 90, 255
selected_color = 100, 150, 200, 255
text_color = 255, 255, 255, 255

[touch]
# Touch-specific settings
touch_radius = 70
swipe_threshold = 80
touch_hold_duration = 500
zoom_min = 0.5
zoom_max = 2.0
